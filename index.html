    // Lecture simple d'un fichier en base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // Compression d'image avec canvas (max 400px, qualité 85%)
    function compressImage(file, maxSize = 400, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            } else if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    }

    // ============================================================
    // 3. ENREGISTREMENT DU CONTACT — avec photo
    // ============================================================
    async function saveContactDirect(data) {
      const btn = document.getElementById("save-contact-btn");
      const originalHtml = btn ? btn.innerHTML : "";
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Ouverture...`;
      }

      try {
        const phones = Array.isArray(data.phones)
          ? data.phones
          : (data.phone ? [{ type: "CELL", number: data.phone }] : []);

        const esc = (v = "") => String(v).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");

        // Préparation de la PHOTO (avatar) pour le vCard
        let photoLine = "";
        const avatarData = data.avatar || (data.links && data.links.avatar);

        if (avatarData && avatarData.startsWith("data:image")) {
          const match = avatarData.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
          if (match) {
            const mime = match[1];
            const base64Data = match[2];

            let imgType = "JPEG";
            if (mime.includes("png")) imgType = "PNG";
            else if (mime.includes("gif")) imgType = "GIF";
            else if (mime.includes("webp")) imgType = "WEBP";

            photoLine = `PHOTO;ENCODING=b;TYPE=${imgType}:${base64Data}`;
          }
        }

        const telEntries = phones
          .map(p => `TEL;TYPE=CELL:${esc(p.number)}`)
          .join("\r\n");

        const vcardData = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN;CHARSET=UTF-8:${esc(data.full_name || '')}`,
          `N;CHARSET=UTF-8:${esc(data.full_name || '')};;;;`,
          data.company ? `ORG;CHARSET=UTF-8:${esc(data.company)}` : '',
          data.job_title ? `TITLE;CHARSET=UTF-8:${esc(data.job_title)}` : '',
          telEntries,
          photoLine,
          "END:VCARD"
        ].filter(Boolean).join("\r\n");

        const ua = navigator.userAgent;
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        // 1) iOS : data-URL vCard
        if (isIOS) {
          const dataUrl = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcardData);
          const a = document.createElement("a");
          a.href = dataUrl;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          return;
        }

        // 2) Android & Desktop : Web Share API
        const fileName = (data.full_name || data.slug || "contact")
          .replace(/\s+/g, "_") + ".vcf";
        const file = new File([vcardData], fileName, { type: "text/vcard" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          showToast("👉 Choisissez « Contacts » dans le menu qui s'ouvre");
          try {
            await navigator.share({
              files: [file],
              title: data.full_name || "Contact",
              text: `Contact : ${data.full_name || ""}`
            });
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }

        // 3) Fallback : téléchargement .vcf
        const blob = new Blob([vcardData], { type: "text/x-vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast("📁 Fichier .vcf téléchargé — tapez dessus pour l'ajouter à vos contacts");

      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    // Module d'écriture Web NFC
    async function writeNfcTag(customUrl = null) {
      const targetUrl = customUrl || window.location.href;
      const statusEl = document.getElementById("nfc-live-status");

      if (!('NDEFReader' in window)) {
        alert("⚠️ L'écriture NFC directe depuis le navigateur nécessite Google Chrome sur un smartphone Android avec le NFC activé.\n\nSur iPhone ou PC : Copiez simplement votre lien et écrivez-le avec l'application gratuite 'NFC Tools'.");
        return;
      }

      try {
        if (statusEl) statusEl.innerHTML = `<span class="text-blue-600 font-semibold animate-pulse"><i class="fa-solid fa-spinner fa-spin"></i> Approchez votre carte NFC du dos de votre smartphone...</span>`;
        const ndef = new NDEFReader();
        await ndef.write({ records: [{ recordType: "url", data: targetUrl }] });
        if (statusEl) statusEl.innerHTML = `<span class="text-emerald-700 font-bold"><i class="fa-solid fa-circle-check"></i> Carte NFC écrite avec succès !</span>`;
        alert("✅ Succès ! Votre carte NFC est programmée pour ouvrir :\n" + targetUrl);
      } catch (err) {
        if (statusEl) statusEl.innerHTML = `<span class="text-red-600">❌ Erreur d'écriture : ${err.message}</span>`;
      }
    }

          </div>

          <div id="status-box"></div>

          <form id="mainCardForm" class="space-y-5">
            <div>
              <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Identifiant URL unique (slug)</label>
              <input type="text" id="slug" value="${currentData.slug}" ${editSlug ? 'readonly class="bg-slate-100 cursor-not-allowed"' : ''} class="w-full p-3 border border-slate-200 rounded-xl text-sm font-mono outline-none focus:border-blue-500" placeholder="ex: amine-bennani" required>
            </div>

            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
              <span class="text-xs font-black text-slate-500 uppercase tracking-wider block">Images</span>
              <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1">1. Image de couverture (Bannière du haut)</label>
                <input type="file" id="banner-input" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <div id="banner-preview" class="mt-2 h-20 w-full rounded-xl overflow-hidden border border-slate-200 ${currentData.banner ? '' : 'hidden'}">
                  <img src="${currentData.banner}" class="w-full h-full object-cover">
                </div>
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1">2. Photo de profil ou Logo (Cercle) — <span class="text-emerald-600">incluse dans le contact</span></label>
                <input type="file" id="avatar-input" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <div id="avatar-preview" class="mt-2 w-16 h-16 rounded-full overflow-hidden border-2 border-slate-200 ${currentData.avatar ? '' : 'hidden'}">
                  <img src="${currentData.avatar}" class="w-full h-full object-cover">
                </div>
              </div>
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Nom complet</label>
              <input type="text" id="full_name" value="${currentData.full_name}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="ex: Amine Bennani" required>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Poste / Fonction</label>
                <input type="text" id="job_title" value="${currentData.job_title}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="ex: Directeur Commercial">
              </div>
              <div>
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Entreprise</label>
                <input type="text" id="company" value="${currentData.company}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="ex: Atlas Tech">
              </div>
            </div>

            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-black text-slate-600 uppercase tracking-wider">Numéros de téléphone</span>
                <button type="button" id="add-phone-btn" class="text-xs font-bold text-blue-600 hover:text-blue-700">
                  <i class="fa-solid fa-plus mr-1"></i> Ajouter un numéro
                </button>
              </div>
              <p class="text-[10px] text-slate-400 mb-2">💡 Astuce : saisissez « WhatsApp » ou « Telegram » comme type pour activer le lien direct. Numéro au format international recommandé (ex: +2126...).</p>
              <div id="phones-container" class="space-y-2"></div>
            </div>

            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-black text-slate-600 uppercase tracking-wider">Réseaux sociaux & Liens</span>
                <button type="button" id="add-link-btn" class="text-xs font-bold text-blue-600 hover:text-blue-700">
                  <i class="fa-solid fa-plus mr-1"></i> Ajouter un lien
                </button>
              </div>
              <div id="links-container" class="space-y-2"></div>
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-2">Couleur d'accent</label>
              <div class="flex items-center gap-3" id="palette-selector">
                <button type="button" data-color="blue" class="w-8 h-8 rounded-full bg-blue-600 ring-2 ring-offset-2 ring-blue-600"></button>
                <button type="button" data-color="emerald" class="w-8 h-8 rounded-full bg-emerald-600"></button>
                <button type="button" data-color="dark" class="w-8 h-8 rounded-full bg-slate-900"></button>
                <button type="button" data-color="teal" class="w-8 h-8 rounded-full bg-teal-600"></button>
              </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-2xl shadow transition text-sm">
              Enregistrer le profil digital
            </button>
          </form>
        </div>
      `;

      let selectedColor = currentData.accent_color || "blue";
      let bannerBase64 = currentData.banner || "";
      let avatarBase64 = currentData.avatar || "";

      const colorBtns = document.querySelectorAll("#palette-selector button");
      colorBtns.forEach(btn => {
        btn.onclick = () => {
          colorBtns.forEach(b => b.className = b.className.replace(/ring-2 ring-offset-2 ring-\w+-600/, ''));
          btn.classList.add("ring-2", "ring-offset-2", `ring-${btn.dataset.color === 'dark' ? 'slate-900' : btn.dataset.color + '-600'}`);
          selectedColor = btn.dataset.color;
        };
      });

      const bannerInput = document.getElementById("banner-input");
      const avatarInput = document.getElementById("avatar-input");

      bannerInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          bannerBase64 = await compressImage(file, 1200, 0.82);
          const preview = document.getElementById("banner-preview");
          preview.innerHTML = `<img src="${bannerBase64}" class="w-full h-full object-cover">`;
          preview.classList.remove("hidden");
        }
      };

      avatarInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          avatarBase64 = await compressImage(file, 400, 0.85);
          const preview = document.getElementById("avatar-preview");
          preview.innerHTML = `<img src="${avatarBase64}" class="w-full h-full object-cover">`;
          preview.classList.remove("hidden");
        }
      };

      const phonesContainer = document.getElementById("phones-container");
      function addPhoneRow(type = "WhatsApp", number = "") {
        const div = document.createElement("div");
        div.className = "flex items-center gap-2 phone-row";
        div.innerHTML = `
          <input type="text" value="${type}" class="w-1/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="Type (WhatsApp, Téléphone…)">
          <input type="tel" value="${number}" class="w-2/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="+2126...">
          <button type="button" class="text-slate-400 hover:text-red-500 px-2 py-1" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash text-xs"></i></button>
        `;
        phonesContainer.appendChild(div);
      }

      currentData.phones.forEach(p => addPhoneRow(p.type, p.number));
      document.getElementById("add-phone-btn").onclick = () => addPhoneRow("Téléphone", "");

      const linksContainer = document.getElementById("links-container");
      function addLinkRow(platform = "instagram", url = "", customName = "") {
        const div = document.createElement("div");
        div.className = "flex items-center gap-2 link-row";
        div.innerHTML = `
          <select class="w-1/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold">
            ${Object.keys(PLATFORMS).map(k => `<option value="${k}" ${k === platform ? 'selected' : ''}>${PLATFORMS[k].name}</option>`).join('')}
          </select>
          <input type="text" value="${url}" class="w-2/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="Coller le lien ou @pseudo">
          <button type="button" class="text-slate-400 hover:text-red-500 px-2 py-1" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash text-xs"></i></button>
        `;
        linksContainer.appendChild(div);
      }

      currentData.custom_links.forEach(l => addLinkRow(l.platform, l.url, l.customName));
      document.getElementById("add-link-btn").onclick = () => addLinkRow("instagram", "");

      document.getElementById("btn-nfc-standalone").onclick = () => {
        const slug = document.getElementById("slug").value.trim().toLowerCase();
        const writeUrl = slug ? `${window.location.origin}/?c=${slug}` : window.location.href;
        writeNfcTag(writeUrl);
      };

      document.getElementById("mainCardForm").onsubmit = async (e) => {
        e.preventDefault();
        const slug = document.getElementById("slug").value.trim().toLowerCase();
        const status = document.getElementById("status-box");

        const collectedPhones = [];
        document.querySelectorAll(".phone-row").forEach(row => {
          const inputs = row.querySelectorAll("input");
          const type = inputs[0].value.trim();
          const number = inputs[1].value.trim();
          if (number) collectedPhones.push({ type, number });
        });

        const collectedLinks = [];
        document.querySelectorAll(".link-row").forEach(row => {
          const select = row.querySelector("select");
          const input = row.querySelector("input");
          const platform = select.value;
          const url = input.value.trim();
          if (url) collectedLinks.push({ platform, url });
        });

        const payload = {
          slug: slug,
          full_name: document.getElementById("full_name").value.trim(),
          job_title: document.getElementById("job_title").value.trim(),
          company: document.getElementById("company").value.trim(),
          phone: collectedPhones[0] ? collectedPhones[0].number : "",
          accent_color: selectedColor,
          links: {
            banner: bannerBase64,
            avatar: avatarBase64,
            phones: collectedPhones,
            custom_links: collectedLinks
          }
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "apikey": API_KEY,
              "Authorization": `Bearer ${API_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.message || "Erreur " + res.status);
          }

          const publicUrl = `${window.location.origin}/?c=${slug}`;
          const editUrl = `${window.location.origin}/?edit=${slug}`;

          status.innerHTML = `
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-900 p-4 rounded-2xl mb-5 text-xs space-y-3 shadow-sm">
              <div class="font-bold text-sm text-emerald-800"><i class="fa-solid fa-circle-check"></i> Profil enregistré avec succès !</div>
              <div><b>Lien Public de la carte :</b> <a href="${publicUrl}" target="_blank" class="underline text-blue-600 font-mono">${publicUrl}</a></div>
              <div><b>Lien de modification sans la carte :</b> <a href="${editUrl}" target="_blank" class="underline text-blue-600 font-mono">${editUrl}</a></div>
            </div>
          `;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          status.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-xl mb-4 text-xs font-semibold">❌ Échec de l'enregistrement : ${err.message}</div>`;
        }
      };
    }

    // ============================================================
    // 6. ROUTAGE AVEC CONTRÔLE D'ACCÈS
    // ============================================================
    const path = window.location.pathname;
    const cSlug = getParam("c");
    const editSlug = getParam("edit");

    // Déterminer si on est sur la route /edit (ou ?edit=...)
    const isEditRoute = path.startsWith("/edit") || !!editSlug;

    // 1) Profil public : toujours accessible
    if (cSlug) {
      renderProfile(cSlug);
    }
    // 2) Route /edit ou ?edit=... : protégée
    else if (isEditRoute) {
      const isAuth = sessionStorage.getItem("tapcard_auth") === "true";
      if (isAuth) {
        renderForm(editSlug || null);
      } else {
        renderLoginScreen(() => renderForm(editSlug || null));
      }
    }
    // 3) Accueil (/) : protégé
    else {
      const isAuth = sessionStorage.getItem("tapcard_auth") === "true";
      if (isAuth) {
        renderForm();
      } else {
        renderLoginScreen(() => renderForm());
      }
    }
  </script>
</body>
</html>
