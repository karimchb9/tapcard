<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAPCARD • Cartes Connectées NFC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .phone-mockup {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans antialiased text-slate-800">

  <!-- En-tête -->
  <header class="w-full max-w-md flex justify-between items-center py-4 mb-2">
    <div class="flex items-center gap-2">
      <span class="text-2xl font-black tracking-tight text-slate-900">TAP<span class="text-blue-600">CARD</span></span>
      <i class="fa-solid fa-wifi rotate-90 text-blue-600 text-sm"></i>
    </div>
    <div id="nav-actions"></div>
  </header>

  <main id="root" class="w-full max-w-md flex flex-col items-center">
    <!-- Le contenu dynamique se charge ici -->
  </main>

  <footer class="mt-8 text-xs text-slate-400">
    Propulsé par TAPCARD • NFC
  </footer>

  <script>
    // Configuration Supabase
    const API_URL = "https://diebuttlhhxgqomxvmcj.supabase.co/rest/v1/cards";
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZWJ1dHRsaGh4Z3FvbXh2bWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NTA5MTYsImV4cCI6MjEwNTQyNjkxNn0.0-jqP2GKpswYCFQD6dpPznXYUXoX3pk6fWYSkiuvo2w";

    const PALETTES = {
      blue: { hex: "#2563eb", bgGradient: "from-blue-100 via-blue-50 to-white", btn: "bg-blue-600 hover:bg-blue-700" },
      emerald: { hex: "#10b981", bgGradient: "from-emerald-100 via-emerald-50 to-white", btn: "bg-emerald-600 hover:bg-emerald-700" },
      dark: { hex: "#0f172a", bgGradient: "from-slate-200 via-slate-50 to-white", btn: "bg-slate-900 hover:bg-slate-800" },
      teal: { hex: "#0d9488", bgGradient: "from-teal-100 via-teal-50 to-white", btn: "bg-teal-600 hover:bg-teal-700" }
    };

    function getParam(key) {
      const p = new URLSearchParams(window.location.search);
      return p.get(key) || null;
    }

    function generateVCard(data) {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${data.full_name || ''}`,
        `ORG:${data.company || ''}`,
        `TITLE:${data.job_title || ''}`,
        `TEL;TYPE=CELL:${data.phone || ''}`,
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${data.slug || 'contact'}.vcf`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 1. VUE DU PROFIL PUBLIC
    async function renderProfile(slug) {
      const root = document.getElementById("root");
      root.innerHTML = `<div class="p-8 bg-white rounded-2xl shadow text-center text-slate-500">Chargement du profil...</div>`;

      try {
        const res = await fetch(`${API_URL}?slug=eq.${encodeURIComponent(slug)}&select=*`, {
          headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
        });
        const rows = await res.json();

        if (!rows || rows.length === 0) {
          root.innerHTML = `
            <div class="bg-white p-6 rounded-2xl text-center shadow-sm w-full">
              <p class="text-red-500 font-semibold mb-2">Profil introuvable</p>
              <p class="text-sm text-slate-500 mb-4">L'identifiant "${slug}" n'a pas encore été créé.</p>
              <a href="/" class="text-blue-600 text-sm font-medium hover:underline">Créer cette carte</a>
            </div>
          `;
          return;
        }

        const c = rows[0];
        const links = c.links || {};
        const colorKey = c.accent_color || "blue";
        const palette = PALETTES[colorKey] || PALETTES.blue;
        const initial = c.full_name ? c.full_name.trim().charAt(0).toUpperCase() : 'T';

        document.getElementById("nav-actions").innerHTML = `
          <a href="/?edit=${c.slug}" class="text-xs bg-white border border-slate-200 px-3 py-1.5 rounded-full text-slate-600 font-medium hover:bg-slate-50">
            <i class="fa-solid fa-pen mr-1"></i> Modifier
          </a>
        `;

        root.innerHTML = `
          <div class="phone-mockup w-full bg-white rounded-[40px] overflow-hidden border border-slate-200">
            <!-- Dynamic Island -->
            <div class="bg-slate-900 w-28 h-6 rounded-full mx-auto mt-3 mb-1"></div>

            <!-- Dégradé et Avatar -->
            <div class="bg-gradient-to-b ${palette.bgGradient} pt-6 pb-6 px-6 text-center">
              <div class="w-24 h-24 mx-auto rounded-full bg-slate-900 text-white flex items-center justify-center text-3xl font-bold border-4 border-white shadow-md">
                ${initial}
              </div>
              <h1 class="text-xl font-bold text-slate-900 mt-3">${c.full_name || ''}</h1>
              <p class="text-sm text-slate-500 font-medium">${c.job_title || ''}</p>
              ${c.company ? `
                <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/80 backdrop-blur rounded-full text-xs font-semibold text-slate-700 mt-2 shadow-sm border border-slate-100">
                  <i class="fa-solid fa-building text-slate-400"></i> ${c.company}
                </div>
              ` : ''}
            </div>

            <div class="p-6 space-y-4">
              <!-- Bouton vCard -->
              <button id="vcard-btn" class="w-full ${palette.btn} text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-address-card"></i> Enregistrer le contact
              </button>

              <!-- Pilules de raccourcis réseaux -->
              <div class="grid grid-cols-2 gap-2 pt-1">
                ${links.whatsapp ? `
                  <a href="https://wa.me/${links.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-emerald-50 text-emerald-700 font-semibold text-sm rounded-xl hover:bg-emerald-100 transition border border-emerald-100">
                    <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp
                  </a>
                ` : ''}
                ${links.instagram ? `
                  <a href="${links.instagram.startsWith('http') ? links.instagram : 'https://instagram.com/' + links.instagram.replace('@','')}" target="_blank" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-pink-50 text-pink-600 font-semibold text-sm rounded-xl hover:bg-pink-100 transition border border-pink-100">
                    <i class="fa-brands fa-instagram text-lg"></i> Instagram
                  </a>
                ` : ''}
                ${links.linkedin ? `
                  <a href="${links.linkedin.startsWith('http') ? links.linkedin : 'https://' + links.linkedin}" target="_blank" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-blue-50 text-blue-700 font-semibold text-sm rounded-xl hover:bg-blue-100 transition border border-blue-100">
                    <i class="fa-brands fa-linkedin text-lg"></i> LinkedIn
                  </a>
                ` : ''}
                ${links.facebook ? `
                  <a href="${links.facebook.startsWith('http') ? links.facebook : 'https://' + links.facebook}" target="_blank" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-slate-100 text-slate-800 font-semibold text-sm rounded-xl hover:bg-slate-200 transition border border-slate-200">
                    <i class="fa-brands fa-facebook text-lg"></i> Facebook
                  </a>
                ` : ''}
              </div>

              <!-- Coordonnées détaillées -->
              <div class="space-y-2 pt-2">
                ${c.phone ? `
                  <a href="tel:${c.phone}" class="flex items-center gap-3 p-3.5 bg-slate-50 rounded-2xl hover:bg-slate-100 transition border border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-slate-600 shadow-sm">
                      <i class="fa-solid fa-phone"></i>
                    </div>
                    <div>
                      <div class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Téléphone</div>
                      <div class="text-sm font-semibold text-slate-800">${c.phone}</div>
                    </div>
                  </a>
                ` : ''}

                ${links.website ? `
                  <a href="${links.website.startsWith('http') ? links.website : 'https://' + links.website}" target="_blank" class="flex items-center gap-3 p-3.5 bg-slate-50 rounded-2xl hover:bg-slate-100 transition border border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-slate-600 shadow-sm">
                      <i class="fa-solid fa-globe"></i>
                    </div>
                    <div>
                      <div class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Site Web</div>
                      <div class="text-sm font-semibold text-slate-800 truncate">${links.website}</div>
                    </div>
                  </a>
                ` : ''}
              </div>
            </div>
          </div>
        `;

        document.getElementById("vcard-btn").onclick = () => generateVCard(c);

      } catch (e) {
        root.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-2xl">Erreur de chargement: ${e.message}</div>`;
      }
    }

    // 2. VUE FORMULAIRE (CRÉATION OU MODIFICATION)
    async function renderForm(editSlug = null) {
      const root = document.getElementById("root");
      let currentData = { slug: "", full_name: "", job_title: "", company: "", phone: "", links: {}, accent_color: "blue" };

      if (editSlug) {
        root.innerHTML = `<div class="p-8 bg-white rounded-2xl shadow text-center text-slate-500">Récupération des coordonnées...</div>`;
        try {
          const res = await fetch(`${API_URL}?slug=eq.${encodeURIComponent(editSlug)}&select=*`, {
            headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
          });
          const rows = await res.json();
          if (rows && rows.length > 0) currentData = rows[0];
        } catch (e) {}
      }

      root.innerHTML = `
        <div class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-200 w-full">
          <div class="mb-6">
            <h2 class="text-xl font-bold text-slate-900">${editSlug ? 'Modifier votre profil' : 'Votre profil digital, en direct'}</h2>
            <p class="text-xs text-slate-500 mt-1">Mettez à jour vos coordonnées à distance sans avoir la carte NFC.</p>
          </div>

          <div id="status-box"></div>

          <form id="profileForm" class="space-y-4">
            <div>
              <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider block mb-1">Identifiant URL (slug)</label>
              <input type="text" id="slug" value="${currentData.slug || ''}" ${editSlug ? 'readonly class="bg-slate-100 cursor-not-allowed"' : ''} class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500 font-mono" placeholder="ex: karim" required>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider block mb-1">Nom complet</label>
              <input type="text" id="full_name" value="${currentData.full_name || ''}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="ex: Karim" required>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider block mb-1">Poste</label>
                <input type="text" id="job_title" value="${currentData.job_title || ''}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="Directeur Commercial">
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider block mb-1">Entreprise</label>
                <input type="text" id="company" value="${currentData.company || ''}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="Entreprise">
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider block mb-1">Téléphone & WhatsApp</label>
              <input type="tel" id="phone" value="${currentData.phone || ''}" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="+212600000000">
            </div>

            <div class="pt-2 border-t border-slate-100 space-y-3">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Réseaux Sociaux (collez vos liens)</span>
              <div class="relative">
                <i class="fa-brands fa-instagram absolute left-3 top-3.5 text-pink-500"></i>
                <input type="text" id="insta" value="${(currentData.links && currentData.links.instagram) || ''}" class="w-full p-3 pl-9 border border-slate-200 rounded-xl text-sm outline-none focus:border-pink-500" placeholder="Lien Instagram ou @pseudo">
              </div>
              <div class="relative">
                <i class="fa-brands fa-linkedin absolute left-3 top-3.5 text-blue-600"></i>
                <input type="text" id="linkedin" value="${(currentData.links && currentData.links.linkedin) || ''}" class="w-full p-3 pl-9 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="Lien profil LinkedIn">
              </div>
              <div class="relative">
                <i class="fa-brands fa-facebook absolute left-3 top-3.5 text-blue-700"></i>
                <input type="text" id="facebook" value="${(currentData.links && currentData.links.facebook) || ''}" class="w-full p-3 pl-9 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-700" placeholder="Lien page Facebook">
              </div>
              <div class="relative">
                <i class="fa-solid fa-globe absolute left-3 top-3.5 text-slate-500"></i>
                <input type="text" id="website" value="${(currentData.links && currentData.links.website) || ''}" class="w-full p-3 pl-9 border border-slate-200 rounded-xl text-sm outline-none focus:border-slate-700" placeholder="Site web (https://...)">
              </div>
            </div>

            <div class="pt-2">
              <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider block mb-2">Couleur d'accent</label>
              <div class="flex items-center gap-3" id="color-picker">
                <button type="button" data-color="blue" class="w-8 h-8 rounded-full bg-blue-600 ring-2 ring-offset-2 ring-blue-600"></button>
                <button type="button" data-color="emerald" class="w-8 h-8 rounded-full bg-emerald-600"></button>
                <button type="button" data-color="dark" class="w-8 h-8 rounded-full bg-slate-900"></button>
                <button type="button" data-color="teal" class="w-8 h-8 rounded-full bg-teal-600"></button>
              </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition shadow mt-4">
              Sauvegarder les modifications
            </button>
          </form>
        </div>
      `;

      let selectedColor = currentData.accent_color || "blue";
      const pickerButtons = document.querySelectorAll("#color-picker button");
      pickerButtons.forEach(btn => {
        btn.onclick = () => {
          pickerButtons.forEach(b => b.className = b.className.replace(/ring-2 ring-offset-2 ring-\w+-600/, ''));
          btn.classList.add("ring-2", "ring-offset-2", `ring-${btn.dataset.color === 'dark' ? 'slate-900' : btn.dataset.color + '-600'}`);
          selectedColor = btn.dataset.color;
        };
      });

      document.getElementById("profileForm").onsubmit = async (e) => {
        e.preventDefault();
        const slug = document.getElementById("slug").value.trim().toLowerCase();
        const status = document.getElementById("status-box");

        const payload = {
          slug: slug,
          full_name: document.getElementById("full_name").value.trim(),
          job_title: document.getElementById("job_title").value.trim(),
          company: document.getElementById("company").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          accent_color: selectedColor,
          links: {
            whatsapp: document.getElementById("phone").value.trim(),
            instagram: document.getElementById("insta").value.trim(),
            linkedin: document.getElementById("linkedin").value.trim(),
            facebook: document.getElementById("facebook").value.trim(),
            website: document.getElementById("website").value.trim()
          }
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "apikey": API_KEY,
              "Authorization": `Bearer ${API_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.message || "Erreur " + res.status);
          }

          const publicUrl = `${window.location.origin}/?c=${slug}`;
          const editUrl = `${window.location.origin}/?edit=${slug}`;

          status.innerHTML = `
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-2xl mb-4 text-xs space-y-2">
              <div class="font-bold text-sm">✅ Profil enregistré avec succès !</div>
              <div><b>Lien Public :</b> <a href="${publicUrl}" target="_blank" class="underline text-blue-600">${publicUrl}</a></div>
              <div><b>Lien de modification (à conserver) :</b> <a href="${editUrl}" target="_blank" class="underline text-blue-600">${editUrl}</a></div>
            </div>
          `;
        } catch (err) {
          status.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-xl mb-4 text-xs">❌ Sauvegarde impossible : ${err.message}</div>`;
        }
      };
    }

    const cSlug = getParam("c");
    const editSlug = getParam("edit");

    if (cSlug) {
      renderProfile(cSlug);
    } else if (editSlug) {
      renderForm(editSlug);
    } else {
      renderForm();
    }
  </script>
</body>
</html>
