    function compressImage(file, maxSize = 400, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxSize) {
              height = Math.round((height * maxSize) / width); width = maxSize;
            } else if (height > maxSize) {
              width = Math.round((width * maxSize) / height); height = maxSize;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            canvas.toBlob(b => resolve(b), "image/jpeg", quality);
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadImage(file, prefix) {
      if (!file) return null;
      const blob = await compressImage(file, prefix === "banner" ? 1200 : 400,
                                              prefix === "banner" ? 0.82 : 0.85);
      const name = `${prefix}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await supabase.storage.from(BUCKET).upload(name, blob, {
        contentType: "image/jpeg", cacheControl: "31536000"
      });
      if (error) throw error;
      const { data } = supabase.storage.from(BUCKET).getPublicUrl(name);
      return data.publicUrl;
    }

    // ═══════════════════════════════════════════════════════════
    // 🆕 CONVERSION PHOTO URL → BASE64 POUR V-CARD
    // Télécharge l'image depuis Supabase Storage et la convertit
    // en base64 pour l'insérer dans le contact.
    // ═══════════════════════════════════════════════════════════
    async function urlToVCardPhoto(imageUrl) {
      if (!imageUrl) return "";
      try {
        // Charger l'image depuis l'URL
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.crossOrigin = "anonymous";
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = imageUrl;
        });

        // Redimensionner à 200x200 max (les contacts n'ont pas besoin de plus)
        const maxSize = 200;
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);

        // Convertir en JPEG base64
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        const match = dataUrl.match(/^data:image\/[a-zA-Z+]+;base64,(.+)$/);
        if (!match) return "";

        return `PHOTO;ENCODING=b;TYPE=JPEG:${match[1]}`;
      } catch (err) {
        console.warn("Photo non intégrée au contact :", err);
        return "";
      }
    }

    async function writeNfcTag(customUrl = null) {
      const targetUrl = customUrl || window.location.href;
      const statusEl = document.getElementById("nfc-live-status");

      if (!('NDEFReader' in window)) {
        alert("⚠️ L'écriture NFC directe nécessite :\n\n" +
              "• Google Chrome sur Android\n" +
              "• NFC activé dans les paramètres\n" +
              "• Un site en HTTPS (Vercel c'est bon)\n\n" +
              "Sur iPhone ou PC :\n" +
              "Copiez le lien et utilisez l'application gratuite 'NFC Tools' pour écrire.");
        return;
      }

      try {
        if (statusEl) {
          statusEl.innerHTML = `<span class="text-blue-600 font-semibold animate-pulse"><i class="fa-solid fa-spinner fa-spin"></i> Approchez votre carte NFC du dos du téléphone...</span>`;
        }

        const ndef = new NDEFReader();
        await ndef.write({ records: [{ recordType: "url", data: targetUrl }] });

        if (statusEl) {
          statusEl.innerHTML = `<span class="text-emerald-700 font-bold"><i class="fa-solid fa-circle-check"></i> Carte NFC écrite avec succès !</span>`;
        }
        alert("✅ Carte NFC programmée avec succès !\n\nElle ouvrira :\n" + targetUrl);

      } catch (err) {
        if (statusEl) {
          statusEl.innerHTML = `<span class="text-red-600">❌ Erreur : ${err.message}</span>`;
        }
        alert("❌ Erreur d'écriture NFC :\n\n" + err.message);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // V-CARD AVEC PHOTO + RÉSEAUX SOCIAUX
    // ═══════════════════════════════════════════════════════════
    async function saveContactDirect(data) {
      const btn = document.getElementById("save-contact-btn");
      const orig = btn ? btn.innerHTML : "";
      if (btn) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Ouverture...`; }

      try {
        const phones = Array.isArray(data.phones) ? data.phones : (data.phone ? [{ type: "CELL", number: data.phone }] : []);
        const esc = v => String(v || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");

        // ─── Photo (nouvelle logique : URL OU base64) ───
        let photoLine = "";
        const avatarData = data.avatar || (data.links && data.links.avatar);
        if (avatarData) {
          if (avatarData.startsWith("data:image")) {
            // Base64 legacy (au cas où)
            const m = avatarData.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
            if (m) {
              let t = "JPEG";
              if (m[1].includes("png")) t = "PNG";
              else if (m[1].includes("gif")) t = "GIF";
              else if (m[1].includes("webp")) t = "WEBP";
              photoLine = `PHOTO;ENCODING=b;TYPE=${t}:${m[2]}`;
            }
          } else if (avatarData.startsWith("http")) {
            // Nouvelle logique : URL Supabase → conversion en base64
            photoLine = await urlToVCardPhoto(avatarData);
          }
        }

        // ─── Téléphones ───
        const telEntries = phones.map(p => `TEL;TYPE=CELL:${esc(p.number)}`).join("\r\n");

        // ─── Réseaux sociaux & liens ───
        const customLinks = (data.links && data.links.custom_links) || [];
        const socialLines = [];
        let websiteLine = "";
        let mapsLine = "";

        const prefixes = {
          instagram: "https://instagram.com/",
          linkedin:  "https://linkedin.com/in/",
          facebook:  "https://facebook.com/",
          tiktok:    "https://tiktok.com/@",
          youtube:   "https://youtube.com/",
          gmail:     "mailto:",
          website:   "",
          location:  "",
          other:     ""
        };

        const platformNames = {
          instagram: "Instagram", linkedin: "LinkedIn", facebook: "Facebook",
          tiktok: "TikTok", youtube: "YouTube", gmail: "Gmail",
          website: "Site_web", location: "Localisation", other: "Lien"
        };

        customLinks.forEach(l => {
          const platform = l.platform;
          let url = (l.url || "").trim();
          if (!url) return;

          if (!/^https?:\/\//.test(url) && !/^mailto:/.test(url)) {
            const pfx = prefixes[platform] || "https://";
            url = pfx + url.replace(/^@/, "");
          }

          const label = (l.customName || platformNames[platform] || "Lien").replace(/\s+/g, "_");

          if (platform === "website") {
            websiteLine = `URL:${esc(url)}`;
          } else if (platform === "location") {
            mapsLine = `X-ADDRESS:${esc(url)}`;
          } else if (platform === "gmail") {
            socialLines.push(`EMAIL;TYPE=INTERNET:${esc(url.replace("mailto:", ""))}`);
          } else if (["instagram", "linkedin", "facebook", "tiktok", "youtube"].includes(platform)) {
            socialLines.push(`X-SOCIALPROFILE;TYPE=${platform}:${esc(url)}`);
            socialLines.push(`URL;TYPE=${label}:${esc(url)}`);
          } else {
            socialLines.push(`URL;TYPE=${label}:${esc(url)}`);
          }
        });

        const publicUrl = location.origin + "/?c=" + (data.slug || "");

        // ─── Construction vCard ───
        const vcardLines = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN;CHARSET=UTF-8:${esc(data.full_name || "")}`,
          `N;CHARSET=UTF-8:${esc(data.full_name || "")};;;;`,
          data.company ? `ORG;CHARSET=UTF-8:${esc(data.company)}` : "",
          data.job_title ? `TITLE;CHARSET=UTF-8:${esc(data.job_title)}` : "",
          telEntries,
          photoLine,
          websiteLine,
          ...socialLines,
          mapsLine,
          `URL;TYPE=Carte_visite:${esc(publicUrl)}`,
          `NOTE;CHARSET=UTF-8:Retrouvez ma carte de visite numérique : ${esc(publicUrl)}`,
          "END:VCARD"
        ].filter(Boolean);

        const vcard = vcardLines.join("\r\n");

        // ─── Envoi au téléphone ───
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                     (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          const a = document.createElement("a");
          a.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          return;
        }

        const fileName = (data.full_name || data.slug || "contact").replace(/\s+/g, "_") + ".vcf";
        const file = new File([vcard], fileName, { type: "text/vcard" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          showToast("👉 Choisissez « Contacts » dans le menu qui s'ouvre");
          try { await navigator.share({ files: [file], title: data.full_name || "Contact" }); return; }
          catch (e) { if (e.name === "AbortError") return; }
        }

        const url = URL.createObjectURL(new Blob([vcard], { type: "text/x-vcard;charset=utf-8" }));
        const a = document.createElement("a");
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast("📁 Fichier .vcf téléchargé");

      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = orig; }
      }
    }

          </form>
        </div>`;

      document.getElementById("authForm").onsubmit = async (e) => {
        e.preventDefault();
        const err = document.getElementById("login-error");
        const btn = document.getElementById("loginSubmit");
        err.classList.add("hidden");
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Connexion...`;

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          err.textContent = "Email ou mot de passe incorrect.";
          err.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Se connecter";
          return;
        }
        onSuccess();
      };
    }

    function mountLogoutButton() {
      document.getElementById("nav-actions").innerHTML = `
        <button id="btn-logout" class="text-xs bg-white border border-slate-200 px-3 py-1.5 rounded-full text-red-600 font-semibold hover:bg-red-50 shadow-sm">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Quitter
        </button>`;
      document.getElementById("btn-logout").onclick = async () => {
        await supabase.auth.signOut();
        location.href = "/";
      };
    }

    // ═══════════════════════════════════════════════════════════
    // LISTE DES CLIENTS
    // ═══════════════════════════════════════════════════════════
    async function renderClientsList() {
      const root = document.getElementById("root");
      mountLogoutButton();

      root.innerHTML = `
        <div class="bg-white p-5 sm:p-6 rounded-[36px] shadow-sm border border-slate-200 w-full mb-8">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h2 class="text-xl font-black text-slate-900 tracking-tight">Mes clients</h2>
              <p class="text-xs text-slate-500 mt-0.5"><span id="clients-count">…</span> carte(s)</p>
            </div>
            <a href="?edit=new" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow transition">
              <i class="fa-solid fa-plus"></i> Nouveau
            </a>
          </div>
          <div class="relative mb-4">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="search-input" placeholder="Rechercher par nom, entreprise ou slug…"
              class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500">
          </div>
          <div id="clients-list" class="space-y-2">
            <div class="text-center text-slate-400 text-xs py-8"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>
          </div>
        </div>`;

      let allClients = [];
      try {
        const { data, error } = await supabase.from("cards").select("*").order("created_at", { ascending: false });
        if (error) throw error;
        allClients = data || [];
      } catch (e) {
        document.getElementById("clients-list").innerHTML =
          `<div class="text-center text-red-500 text-xs py-8">Erreur : ${e.message}</div>`;
        return;
      }

      document.getElementById("clients-count").textContent = allClients.length;
      let query = "";

      const matches = c => {
        if (!query) return true;
        const q = query.toLowerCase();
        return [c.full_name, c.company, c.slug, c.job_title].filter(Boolean)
          .some(v => String(v).toLowerCase().includes(q));
      };

      function renderRows(list) {
        const box = document.getElementById("clients-list");
        if (!list.length) {
          box.innerHTML = `<div class="text-center text-slate-400 text-xs py-10">
            <i class="fa-solid fa-address-book text-2xl mb-2 opacity-40"></i><br>
            Aucun client pour le moment.<br>
            <a href="?edit=new" class="text-blue-600 font-semibold underline mt-2 inline-block">Créer ma première carte</a></div>`;
          return;
        }
        box.innerHTML = list.map(c => {
          const name = c.full_name || "Sans nom";
          const sub = [c.job_title, c.company].filter(Boolean).join(" · ") || "—";
          const init = name.trim()[0]?.toUpperCase() || "T";
          const avatar = c.links && c.links.avatar;
          const url = `${location.origin}/?c=${c.slug}`;
          return `
            <div class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100 rounded-2xl border border-slate-200 transition">
              <div class="w-11 h-11 rounded-full overflow-hidden bg-white border border-slate-200 flex items-center justify-center flex-shrink-0">
                ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover">`
                         : `<span class="text-base font-black text-slate-500">${init}</span>`}
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-bold text-slate-900 truncate">${name}</div>
                <div class="text-xs text-slate-500 truncate">${sub}</div>
                <div class="text-[10px] font-mono text-slate-400 mt-0.5 truncate">?c=${c.slug}</div>
              </div>
              <div class="flex items-center gap-1 flex-shrink-0">
                <a href="${url}" target="_blank" title="Voir" class="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-blue-600 hover:border-blue-300 transition"><i class="fa-solid fa-eye text-xs"></i></a>
                <a href="?edit=${c.slug}" title="Modifier" class="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-amber-600 hover:border-amber-300 transition"><i class="fa-solid fa-pen text-xs"></i></a>
                <button data-copy="${url}" title="Copier" class="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-emerald-600 hover:border-emerald-300 transition"><i class="fa-solid fa-link text-xs"></i></button>
                <button data-del="${c.slug}" data-name="${name}" title="Supprimer" class="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-red-600 hover:border-red-300 transition"><i class="fa-solid fa-trash text-xs"></i></button>
              </div>
            </div>`;
        }).join("");

        box.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
          try { await navigator.clipboard.writeText(b.dataset.copy); showToast("🔗 Lien copié", 2500); }
          catch { prompt("Copiez ce lien :", b.dataset.copy); }
        });

        box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
          if (!confirm(`Supprimer définitivement la carte de « ${b.dataset.name} » ?`)) return;
          const { error } = await supabase.from("cards").delete().eq("slug", b.dataset.del);
          if (error) { showToast("❌ " + error.message, 5000); return; }
          allClients = allClients.filter(x => x.slug !== b.dataset.del);
          document.getElementById("clients-count").textContent = allClients.length;
          renderRows(allClients.filter(matches));
          showToast("🗑️ Carte supprimée");
        });
      }

      document.getElementById("search-input").oninput = e => {
        query = e.target.value.trim();
        renderRows(allClients.filter(matches));
      };
      renderRows(allClients);
    }

          current.job_title = r.job_title || "";
          current.company = r.company || "";
          current.accent_color = r.accent_color || "blue";

      root.innerHTML = `

          <div class="mb-6">
            <h2 class="text-xl font-black text-slate-900 tracking-tight">${isEdit ? "Modifier le profil" : "Créer un nouveau profil"}</h2>
            <p class="text-xs text-slate-500 mt-1">Session admin active.</p>

          <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 p-4 rounded-2xl mb-6">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-black uppercase text-emerald-900 tracking-wider">
                <i class="fa-solid fa-wifi rotate-90 mr-1 text-emerald-600"></i> Module d'encodage NFC
              </span>
              <span class="text-[10px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full font-bold">Actif</span>
            </div>
            <p class="text-xs text-emerald-800 mb-3">Approchez votre carte NFC du dos du téléphone pour y graver l'adresse de ce profil.</p>

              <i class="fa-solid fa-bolt"></i> Écrire l'URL sur une carte NFC

            </div>

            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
              <span class="text-xs font-black text-slate-500 uppercase tracking-wider block">Images</span>
              <div>

                <div id="banner-preview" class="mt-2 h-20 w-full rounded-xl overflow-hidden border border-slate-200 ${current.banner ? "" : "hidden"}">

              <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1">2. Photo de profil ou logo</label>
                <input type="file" id="avatar-input" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <div id="avatar-preview" class="mt-2 w-16 h-16 rounded-full overflow-hidden border-2 border-slate-200 ${current.avatar ? "" : "hidden"}">
                  <img src="${current.avatar}" class="w-full h-full object-cover">
                </div>
              </div>
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Nom complet</label>
              <input type="text" id="full_name" value="${current.full_name}" required
                class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="ex: Amine Bennani">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Poste</label>
                <input type="text" id="job_title" value="${current.job_title}"
                  class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="ex: Directeur">

              <div>
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Entreprise</label>
                <input type="text" id="company" value="${current.company}"

            </div>

            <div>
              <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-2">Couleur d'accent</label>
              <div class="flex items-center gap-3" id="palette-selector">
                ${Object.keys(PALETTES).map((k, i) => `<button type="button" data-color="${k}" class="w-8 h-8 rounded-full bg-${k === "dark" ? "slate-900" : k + "-600"} ${i === 0 ? "ring-2 ring-offset-2 ring-blue-600" : ""}"></button>`).join("")}
              </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-2xl shadow transition text-sm">
              Enregistrer le profil
            </button>
          </form>
        </div>`;

      let selectedColor = current.accent_color || "blue";
      let bannerUrl = current.banner || "";
      let avatarUrl = current.avatar || "";

      document.querySelectorAll("#palette-selector button").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#palette-selector button").forEach(b =>
            b.className = b.className.replace(/ring-2 ring-offset-2 ring-\w+-600/, "").trim());
          btn.classList.add("ring-2", "ring-offset-2", `ring-${btn.dataset.color === "dark" ? "slate-900" : btn.dataset.color + "-600"}`);
          selectedColor = btn.dataset.color;
        };
      });

      document.getElementById("banner-input").onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        showToast("⬆️ Upload bannière...", 2000);

          bannerUrl = await uploadImage(f, "banner");
          const p = document.getElementById("banner-preview");

        const f = e.target.files[0]; if (!f) return;
        showToast("⬆️ Upload photo...", 2000);
        try {
          avatarUrl = await uploadImage(f, "avatar");
          const p = document.getElementById("avatar-preview");
          p.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover">`;
          p.classList.remove("hidden");
          showToast("✅ Photo prête");

      };

      const phonesBox = document.getElementById("phones-container");

        const div = document.createElement("div");
        div.className = "flex items-center gap-2 phone-row";
        div.innerHTML = `
          <input type="text" value="${type}" class="w-1/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="Type">
          <input type="tel" value="${number}" class="w-2/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="+2126...">
          <button type="button" class="text-slate-400 hover:text-red-500 px-2 py-1" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash text-xs"></i></button>`;
        phonesBox.appendChild(div);
      }
      current.phones.forEach(p => addPhoneRow(p.type, p.number));
      document.getElementById("add-phone-btn").onclick = () => addPhoneRow("Téléphone", "");

      const linksBox = document.getElementById("links-container");
      function addLinkRow(platform = "instagram", url = "", customName = "") {
        const div = document.createElement("div");
        div.className = "flex flex-col gap-2 link-row p-2 bg-white rounded-xl border border-slate-200";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <select class="w-1/3 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold">

            <input type="text" value="${url}" class="link-url flex-1 p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="Lien ou @pseudo">

          <input type="text" value="${customName}" class="link-desc w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold" placeholder="Description (ex: bureau Casablanca)">`;
        linksBox.appendChild(div);
      }
      current.custom_links.forEach(l => addLinkRow(l.platform, l.url, l.customName || ""));
      document.getElementById("add-link-btn").onclick = () => addLinkRow("instagram", "");

      document.getElementById("btn-nfc-standalone").onclick = () => {
        const slug = document.getElementById("slug").value.trim().toLowerCase();
        if (!slug) {
          alert("⚠️ Entrez d'abord un slug (identifiant URL) avant d'écrire la carte NFC.");
          return;
        }
        const writeUrl = `${window.location.origin}/?c=${slug}`;
        writeNfcTag(writeUrl);
      };

      document.getElementById("mainCardForm").onsubmit = async (e) => {
        e.preventDefault();
        const status = document.getElementById("status-box");
        const submitBtn = document.getElementById("submit-btn");
        const slug = document.getElementById("slug").value.trim().toLowerCase();

        const phones = [];
        document.querySelectorAll(".phone-row").forEach(r => {
          const i = r.querySelectorAll("input");
          const t = i[0].value.trim(), n = i[1].value.trim();
          if (n) phones.push({ type: t, number: n });
        });

        const links = [];
        document.querySelectorAll(".link-row").forEach(r => {
          const p = r.querySelector("select").value;
          const u = r.querySelector(".link-url").value.trim();
          const cn = r.querySelector(".link-desc").value.trim();
          if (u) links.push({ platform: p, url: u, customName: cn });
        });

        const payload = {
          slug,
          full_name: document.getElementById("full_name").value.trim(),
          job_title: document.getElementById("job_title").value.trim(),
          company: document.getElementById("company").value.trim(),
          phone: phones[0]?.number || "",
          accent_color: selectedColor,
          links: { banner: bannerUrl, avatar: avatarUrl, phones, custom_links: links }
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Enregistrement...`;

        try {
          const { error } = await supabase.from("cards").upsert(payload, { onConflict: "slug" });
          if (error) throw error;

          const publicUrl = `${location.origin}/?c=${slug}`;
          status.innerHTML = `
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-900 p-4 rounded-2xl mb-5 text-xs space-y-3 shadow-sm">
              <div class="font-bold text-sm text-emerald-800"><i class="fa-solid fa-circle-check"></i> Enregistré avec succès !</div>
              <div><b>Lien public :</b> <a href="${publicUrl}" target="_blank" class="underline text-blue-600 font-mono">${publicUrl}</a></div>
              <div class="pt-2"><a href="/" class="inline-block bg-slate-900 text-white font-bold px-3 py-2 rounded-xl text-xs"><i class="fa-solid fa-arrow-left mr-1"></i>Retour</a></div>
            </div>`;
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (err) {
          status.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-xl mb-4 text-xs font-semibold">❌ Échec : ${err.message}</div>`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Enregistrer le profil";
        }
      };
    }

    // ═══════════════════════════════════════════════════════════
    // ROUTEUR
    // ═══════════════════════════════════════════════════════════
    async function route() {
      const cSlug = getParam("c");
      const editSlug = getParam("edit");

      if (cSlug) return renderProfile(cSlug);

      const session = await getSession();
      if (!session) {
        renderLoginScreen(() => route());
        return;
      }

      if (editSlug) return renderForm(editSlug);
      return renderClientsList();
    }

    supabase.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") location.href = "/";
    });

    route().catch(err => {
      document.getElementById("root").innerHTML = `
        <div class="p-6 bg-red-50 text-red-700 rounded-2xl text-xs">
          <b>Erreur au démarrage :</b><br>${err.message}
        </div>`;
